<!doctype html>
<!--
  SCENE: logo sting. 1920x1080, 4 seconds.

  Nothing is redrawn. The mark is the real cream file from assets/logos/,
  placed inside the green tile exactly as the site header and the social card
  do. The tile is a token-coloured rounded square (radius 10/34 of its size);
  the wordmark is TYPE, set in the wordmark face, never a raster.

  Ground: rail. Hotelink has no texture set, so there is no light-through-logo
  pass here (see ds-motion.js).

  DETERMINISTIC. A pure function of t: ?t=1.25 renders that instant and holds.

  ?t=<sec>  one frozen frame     ?bg=none  transparent     ?bg=paper|rail
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hotelink: logo sting</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="./ds-motion.js"></script>
<script>
DS.run({
  canvas:   document.getElementById('stage'),
  duration: 4.0,
  assets: {
    mark: '../assets/logos/hotelink-mark-cream.svg',
  },

  render(t, a) {
    const { ctx, W, H, img, seg, lerp, ease, setFont, color } = a;

    // Site proportions: tile 34, radius 10, mark (64-unit box) 26, gap 10, wordmark 20.
    const TILE = 220;
    const R    = TILE * 10 / 34;
    const MARK = TILE * 26 / 34 * 40 / 64;   // the file's viewBox is cropped to 40 of 64 units
    const GAP  = TILE * 10 / 34;
    const WORD = TILE * 20 / 34;

    setFont(ctx, { family: 'wordmark', weight: 700, size: WORD });
    const wordW  = ctx.measureText('hotelink').width;
    const totalW = TILE + GAP + wordW;

    // 1 · the tile scales in at centre, then slides left to make room for the word
    const pIn    = ease.outBack(seg(t, 0.00, 0.60));
    const pSlide = ease.outExpo(seg(t, 0.75, 1.60));
    const tileCx = lerp(W / 2, W / 2 - totalW / 2 + TILE / 2, pSlide);
    const cy     = H / 2;
    const s      = lerp(0.6, 1, pIn);

    ctx.save();
    ctx.globalAlpha = seg(t, 0.00, 0.25);
    ctx.translate(tileCx, cy);
    ctx.scale(s, s);
    ctx.fillStyle = color.accentStrong;
    ctx.beginPath();
    ctx.roundRect(-TILE / 2, -TILE / 2, TILE, TILE, R);
    ctx.fill();
    // 2 · the real mark file, unmodified
    const pMark = ease.outQuint(seg(t, 0.25, 0.80));
    ctx.globalAlpha *= pMark;
    const m = MARK * lerp(0.85, 1, pMark);
    ctx.drawImage(img.mark, -m / 2, -m / 2, m, m);
    ctx.restore();

    // 3 · the wordmark is TYPE. Revealed left to right behind the tile.
    const pWord = ease.outExpo(seg(t, 0.95, 1.80));
    if (pWord > 0) {
      const x0 = W / 2 - totalW / 2 + TILE + GAP;
      ctx.save();
      ctx.beginPath();
      ctx.rect(x0, cy - WORD, (wordW + 20) * pWord, WORD * 2);
      ctx.clip();
      ctx.fillStyle = color.paper;
      ctx.textBaseline = 'middle';
      ctx.fillText('hotelink', x0 + lerp(-24, 0, pWord), cy + WORD * 0.04);
      ctx.restore();
    }
  }
});
</script>
</body>
</html>
