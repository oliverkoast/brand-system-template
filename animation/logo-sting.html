<!doctype html>
<!--
  SCENE — logo sting. 1920x1080, 4 seconds.

  THE POINT: nothing is redrawn. The mark is the real file from assets/logos/,
  and the light moving through it is the real texture from assets/textures/.
  Each frame composites the texture into the logo's own alpha, so what you see
  is the approved artwork lit by the approved texture.

  That matters because an animation built by redrawing a logo is a second logo
  nobody is checking. Once it is inside a video it never gets reviewed again.

  DETERMINISTIC. The whole thing is a pure function of t, so ?t=1.25 renders
  that instant and holds. kit/export-frames.sh walks t and screenshots each
  step: no screen recording, no dropped frames, no timing drift.

  ?t=<sec>  one frozen frame     ?bg=none  transparent     ?bg=paper|ink
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northlight — logo sting</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="stage" width="1920" height="1080"></canvas>
<script src="./ds-motion.js"></script>
<script>
DS.run({
  canvas:   document.getElementById('stage'),
  duration: 4.0,
  assets: {
    mark:    '../assets/logos/northlight-mark-white.svg',
    texture: '../assets/textures/texture-dawn-01.png',
  },

  render(t, a) {
    const { ctx, W, H, img, seg, lerp, ease, metal, setFont, color } = a;

    const SIZE = 300;
    const cx = W / 2, cy = H / 2 - 40;

    // 1 · the mark reveals through an expanding circular clip
    const pIn    = ease.outBack(seg(t, 0.00, 0.70));
    const alpha  = seg(t, 0.00, 0.30);
    const clipR  = lerp(0, 0.95, ease.outExpo(seg(t, 0.05, 0.80)));
    const scale  = lerp(0.84, 1, pIn);

    if (alpha > 0 && clipR > 0) {
      // 2 · light travels through it: the sampled window of the real texture pans
      const pan  = lerp(0.05, 0.75, ease.outExpo(seg(t, 0.15, 1.40))) + (t / 4.0) * 0.25;
      const tile = metal(img.mark, img.texture, SIZE, SIZE, pan % 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(cx, cy, clipR * SIZE, 0, Math.PI * 2);
      ctx.clip();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.drawImage(tile, -SIZE / 2, -SIZE / 2);
      ctx.restore();
    }

    // 3 · the wordmark is TYPE, not a file. Set it, never place a raster of it.
    const pWord = ease.outExpo(seg(t, 0.70, 1.45));
    if (pWord > 0) {
      ctx.save();
      ctx.globalAlpha = seg(t, 0.70, 0.85);
      ctx.beginPath();
      ctx.rect(cx - 400, cy + SIZE / 2 + 10, 800 * pWord, 200);
      ctx.clip();
      ctx.fillStyle = color.white;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      setFont(ctx, { family: 'display', weight: 700, size: 96, tracking: '-0.04em' });
      ctx.fillText('NORTHLIGHT', cx, cy + SIZE / 2 + 40 + lerp(12, 0, pWord));
      ctx.restore();
    }
  }
});
</script>
</body>
</html>
