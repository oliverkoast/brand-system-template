<!doctype html>
<!--
  TEMPLATE: title card, 1920x1080.

  Remix this file. Do not rebuild the layout from scratch.

  The layout is the left half of the approved social card
  (reference/og-1200x630.jpg): lockup top left, eyebrow, two-beat headline
  with the second beat in accent green, one line of body, brand tag at the
  foot. Positions are the reference's, scaled by 1.6 (1920 / 1200) and NOT yet
  measured against a 16:9 reference, because none exists (FINDINGS F-06).

  What you change: the eyebrow, the two headline beats, the body line.
  What you never change: the lockup, the token values, the brand tag.

  Export:  kit/render.sh templates/card-16x9.html out/card.png 1920 1080
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hotelink: title card</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; padding: 0; }
  .card { position: relative; width: 1920px; height: 1080px; overflow: hidden;
          background: var(--hl-bg); }
  .card__lockup   { position: absolute; left: 96px; top: 86px; --hl-tile: 88px; }
  .card__eyebrow  { position: absolute; left: 96px; top: 330px; font-size: 24px; }
  .card__headline { position: absolute; left: 92px; top: 380px; width: 1500px;
                    font-size: 176px; }
  .card__body     { position: absolute; left: 96px; top: 760px; width: 1100px;
                    font-size: 40px; line-height: 1.4; }
  .card__tag      { position: absolute; left: 96px; bottom: 96px; font-size: 20px;
                    color: var(--hl-text-soft); }
</style>
</head>
<body>
<div class="card">
  <!-- Green tile, CREAM mark file. Never recolour in code. -->
  <div class="hl-lockup card__lockup">
    <span class="hl-tile"><img src="../assets/logos/hotelink-mark-cream.svg" alt="" /></span>
    <span class="hl-wordmark">hotelink</span>
  </div>
  <p class="hl-eyebrow card__eyebrow">The data platform for independent hotels</p>
  <h1 class="hl-headline card__headline">Your hotel.<br><span class="hl-beat">Connected.</span></h1>
  <p class="hl-body card__body">Every system you run, finally in one place.</p>
  <p class="hl-eyebrow card__tag">Built with Proper Hospitality</p>
</div>
</body>
</html>
