<!doctype html>
<!--
  TEMPLATE — title card, 1920x1080.

  Remix this file. Do not rebuild the layout from scratch.

  In a real system every number here would be MEASURED from your approved
  reference and the measurements recorded in reference/README.md, so a later
  change can be diffed against them. This template ships with sensible values
  because it has no reference to measure against yet. Replacing them with
  measured ones is step 4 of kit/NEW-BRAND.md, and it is the step people skip.

  What you change: the headline, the eyebrow, --ground.
  What you never change: the logo colour rule, the token values.

  Export:  kit/render.sh templates/card-16x9.html out/card.png 1920 1080
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northlight — title card</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  .card {
    /* Pick a texture listed under usage["card-16x9"].ground in assets.json */
    --ground: url("../assets/textures/texture-dawn-01.png");
  }
  html, body { margin: 0; padding: 0; }
  .card {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background-image: var(--ground);
    background-size: cover; background-position: center;
  }
  .card__logo     { position: absolute; left: 96px; top: 88px; width: 132px; height: auto; }
  .card__eyebrow  { position: absolute; left: 100px; top: 268px; font-size: 26px;
                    color: rgba(255,255,255,0.72); }
  .card__headline { position: absolute; left: 96px; top: 312px; width: 1100px;
                    font-size: 132px; color: var(--brand-reverse); }
  .card__foot     { position: absolute; left: 100px; bottom: 92px; font-size: 24px;
                    color: rgba(255,255,255,0.66); }
</style>
</head>
<body>
<div class="card">
  <!-- White variant, because the ground is a texture. Never recolour in code. -->
  <img class="card__logo" src="../assets/logos/northlight-mark-white.svg" alt="Northlight" />
  <p class="brand-eyebrow card__eyebrow">Sample format</p>
  <h1 class="brand-headline card__headline">A title card,<br>built from real files</h1>
  <p class="brand-body card__foot">Replace this with your own approved reference.</p>
</div>
</body>
</html>
