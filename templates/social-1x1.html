<!doctype html>
<!--
  TEMPLATE — square social post, 1080x1080.

  The everyday piece: paper ground with one texture panel on it. Note the logo
  is the INK variant here, because it sits on paper, not on the panel. That
  choice is deterministic (see brand.json colour_usage), not a judgement call.

  Export:  kit/render.sh templates/social-1x1.html out/social.png 1080 1080
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Northlight — social 1:1</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  .post { --panel: url("../assets/textures/texture-dusk-02.png"); }
  html, body { margin: 0; padding: 0; }
  .post { position: relative; width: 1080px; height: 1080px; overflow: hidden;
          background: var(--brand-bg); }
  .post__panel { position: absolute; left: 64px; top: 64px; right: 64px; height: 470px;
                 border-radius: var(--brand-radius);
                 background-image: var(--panel);
                 background-size: cover; background-position: center; }
  .post__logo     { position: absolute; left: 112px; top: 112px; width: 88px; height: auto; }
  .post__eyebrow  { position: absolute; left: 68px; top: 588px; font-size: 20px; }
  .post__headline { position: absolute; left: 64px; top: 628px; width: 940px; font-size: 96px; }
  .post__body     { position: absolute; left: 68px; bottom: 84px; width: 880px; font-size: 26px; }
</style>
</head>
<body>
<div class="post">
  <div class="post__panel"></div>
  <!-- White variant sits ON the panel. -->
  <img class="post__logo" src="../assets/logos/northlight-mark-white.svg" alt="Northlight" />
  <p class="brand-eyebrow post__eyebrow">Sample format</p>
  <h1 class="brand-headline post__headline">Paper ground,<br>one panel</h1>
  <p class="brand-body post__body">Ink type on paper, reversed type on the panel. Never the
     other way round.</p>
</div>
</body>
</html>
