<!doctype html>
<!--
  TEMPLATE: square social post, 1080x1080.

  Paper ground, lockup, eyebrow, two-beat headline, and a deep-green
  accent-strong band at the foot carrying one line in reverse type. The band
  is the site's contact band, not a texture: Hotelink grounds are flat.

  Not measured against a reference (none exists for this format, F-06).

  Export:  kit/render.sh templates/social-1x1.html out/social.png 1080 1080
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>hotelink: social 1:1</title>
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; padding: 0; }
  .post { position: relative; width: 1080px; height: 1080px; overflow: hidden;
          background: var(--hl-bg); }
  .post__lockup   { position: absolute; left: 80px; top: 80px; --hl-tile: 64px; }
  .post__eyebrow  { position: absolute; left: 80px; top: 260px; font-size: 18px; }
  .post__headline { position: absolute; left: 76px; top: 300px; width: 920px;
                    font-size: 120px; }
  .post__band     { position: absolute; left: 0; right: 0; bottom: 0; height: 280px;
                    background: var(--hl-bg-dark); }
  .post__body     { position: absolute; left: 80px; bottom: 110px; width: 900px;
                    font-size: 34px; line-height: 1.4; color: var(--hl-reverse); }
</style>
</head>
<body>
<div class="post">
  <div class="hl-lockup post__lockup">
    <span class="hl-tile"><img src="../assets/logos/hotelink-mark-cream.svg" alt="" /></span>
    <span class="hl-wordmark">hotelink</span>
  </div>
  <p class="hl-eyebrow post__eyebrow">The data platform for independent hotels</p>
  <h1 class="hl-headline post__headline">Your hotel.<br><span class="hl-beat">Connected.</span></h1>
  <div class="post__band"></div>
  <p class="hl-body post__body">Every system your hotel runs, finally in one place.</p>
</div>
</body>
</html>
